    <main>
        <div class="centro-caja">
            <h1>Crear cuenta</h1>
            <p class="subtitulo">Solo para alumnos de quinto año.</p>
            <form class="tarjeta" id="formulario-cuenta">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nombre@mail.com" required>
                <label for="curso">Curso</label>
                <select id="curso" required><option value="">Seleccioná tu curso</option><option>Quinto primera</option><option>Quinto segunda</option><option>Quinto tercera</option><option>Quinto cuarta</option><option>Quinto quinta</option><option>Quinto sexta</option><option>Quinto séptima</option><option>Quinto octava</option></select>
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" placeholder="Mínimo 8 caracteres" minlength="8" required>
                <label class="opcion"><input type="checkbox" required> Acepto las <a href="normas.html">normas de la comunidad</a></label>
                <div class="botones"><button class="boton" type="submit">Crear cuenta</button></div>
            </form>
            <p class="centro">¿Ya tenés cuenta? <a href="ingresar.html">Ingresá</a></p>
        </div>
    </main>
